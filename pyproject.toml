[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-automation"
version = "0.1.0"
description = "Invoice and receipt automation pipeline for a fictional Barcelona-based company (portfolio project)"
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "pandas",
    "rapidfuzz",
    "reportlab",
    "pymupdf",
    "pillow",
    "python-dotenv",
    "anthropic",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pre-commit",
]

[tool.setuptools.packages.find]
include = ["src*", "evals*"]
